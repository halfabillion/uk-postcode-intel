[project]
name = "uk-postcode-intel"
version = "1.0.0"
description = "MCP server created with MCPize"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastmcp>=4.1,<5", "rich>=14.0", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/halfabillion/uk-postcode-intel"
Documentation = "https://mcpize.com/docs"

[project.scripts]
uk-postcode-intel = "uk_postcode_intel.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_postcode_intel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
